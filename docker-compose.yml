services:
  rabit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabit-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - USE_OPENROUTER=${USE_OPENROUTER:-false}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      - DRIFT_RPC_URL=${DRIFT_RPC_URL:-https://api.mainnet-beta.solana.com}
      - DRIFT_PROGRAM_ID=${DRIFT_PROGRAM_ID:-dRiftyHA39MWEi3m9aunc5MzRF1JYJjb5ciH7N27eNn}
      - WS_HOST=0.0.0.0
      - WS_PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - MEM0_ENABLED=${MEM0_ENABLED:-false}
      - MEM0_HOST=${MEM0_HOST:-mem0}
      - MEM0_PORT=${MEM0_PORT:-8080}
      - MEM0_URL=${MEM0_INTERNAL_URL:-http://mem0:8000}
      - MEM0_API_KEY=${MEM0_API_KEY:-}
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - rabit-network
    restart: unless-stopped

  mem0:
    image: mem0/mem0-api-server:latest
    container_name: rabit-mem0
    profiles:
      - memory
    ports:
      - "8080:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_API_KEY=${MEM0_API_KEY:-}
    networks:
      - rabit-network
    restart: unless-stopped
    depends_on:
      - qdrant

  # Qdrant - Vector Database for Mem0
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rabit-qdrant
    profiles:
      - memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rabit-network
    restart: unless-stopped

  # SearXNG - Self-Hosted Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: rabit-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    networks:
      - rabit-network
    restart: unless-stopped

networks:
  rabit-network:
    driver: bridge

volumes:
  qdrant_data:
