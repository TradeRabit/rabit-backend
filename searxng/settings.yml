# SearXNG Configuration - Minimal & Efficient

general:
  debug: false
  instance_name: "Rabit Search"
  
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  
server:
  secret_key: "rabit-searxng-secret-key-change-this"
  limiter: false
  image_proxy: true
  
ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true
  infinite_scroll: false
  
outgoing:
  request_timeout: 3.0
  max_request_timeout: 10.0
  
engines:
  # ============================================================================
  # General Search Engines
  # ============================================================================
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    
  - name: google
    engine: google
    shortcut: go
    disabled: false
    
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    
  # ============================================================================
  # General News Media (Top 20)
  # ============================================================================
  
  # 1. BBC
  - name: bbc
    engine: xpath
    search_url: https://www.bbc.com/search?q={query}
    url_xpath: //a[@class="ssrcss-1mrs5ns-PromoLink"]/@href
    title_xpath: //a[@class="ssrcss-1mrs5ns-PromoLink"]/h3/text()
    content_xpath: //p[@class="ssrcss-1q0x1qg-Paragraph"]/text()
    shortcut: bbc
    categories: [news]
    disabled: false
    
  # 2. CNN
  - name: cnn
    engine: xpath
    search_url: https://www.cnn.com/search?q={query}
    url_xpath: //a[@class="container__link"]/@href
    title_xpath: //span[@class="container__headline-text"]/text()
    content_xpath: //div[@class="container__description"]/text()
    shortcut: cnn
    categories: [news]
    disabled: false
    
  # 3. New York Times
